;AutoSport Racing System — Developer Settings
[GENERAL]
;Sprint+Context (Shift+E) opens the ARS menu. Disable to use the arsmenu cheat instead.
Hotkeys=true

;Load all ARS data at startup. Disable and use arson/arsoff cheats to toggle at runtime.
LoadAtStart=true

;Info,Error,Fatal
LogLevel=Info

[CREATOR_DEFAULTS]
;Trackside gear model used by default when creating a track. 'none' disables the props.
;Spacing in meters.
TracksideModel=prop_wheel_tyre
TracksideModelFrecuency=20
