;AutoSport Racing System — Options
[GENERAL_SETTINGS]
;Default number of laps before the race is considered finished.
Laps=5

;Default track filter (space-separated tags to prefer when auto-selecting a track).
TrackFilter=hardcore

;When there aren't enough unique cars to fill the grid, duplicate cars to fill it.
AllowDuplicates=true

[CATCHUP]
;Catchup mechanics only apply to the latter half of the grid.
OnlyLastHalf=true

;Catchup mechanics only apply to cars behind the player (overrides OnlyLastHalf while racing).
OnlyBehindPlayer=false
