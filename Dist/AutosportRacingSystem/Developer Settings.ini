;Commented out settings are not implemented yet.

[GENERAL]
;Sprint+Context (Shift+E) are used to bring up ARS menu.
;You can disable this and use the arsmenu cheat instead.
Hotkeys=true

;ARS can take a bit to load all the data, you can disable the initial load here.
;Enable and disable it later on with the arson/arsoff cheats.
LoadAtStart=true

;Info,Error,Fatal
LogLevel=Info


[CREATOR_DEFAULTS]
;XML Track files will, by default, be created with this set up for the trackside props. 
;You can enter 'none' on the first value to disable it. Any invalid modelname like 'nope_prop_wheel_tyre' will do too.
TracksideModel=prop_wheel_tyre

;In meters. 20 means the prop will be spawned every 20 meters.
TracksideModelFrecuency=20

[TRACK]
;Thanks to the above, some tracks will feature an automated trackside limit prop spawning system, that helps delimit the track automatically.
;When loading a track, this can take time to spawn. You can disable it here. But depending on the track, you may not have a visual on where the track limits are.
SpawnTracksideProps=true

;Not implemented. Traffic is always disabled in races.
;Wether traffic should be allowed, or actively despawned(false) when there is a race in progress.
;Traffic=false

[RACERS]
;How the grid is sorted. You're always last becuz you are human.
;Power, PowerDescendent, TopSpeed, TopSpeedDescendent, Random
GridSorting=Random

;ARS comes with sensible set ups for the cars included.
;If you prefer a more random set of vehicles, edit this.
;1 = visual tuning, 2 = visual and performance tuning, 3 = visual, performance and a random engine boost.
AITuningLevel=0

;0=disabled. 1=fixed when they break enough to affect their performance. 2=invincible from the start.
AIRacerAutofix=2

;Grace period after the first racer crosses the line.
TimeoutSeconds=30

;Personalities allow racers to have a few preferences while racing, ranging
;from tolerance to wheelspin and being sideways, to how aggresive they can become while near someone else.
UsePersonalities=true

;Dynamic maneuvers allow racers to perform actions mid-race to try and take advantage of a situation,
;like braking a bit later, or leaving a corner flatout trying to keep their position or catch the guy ahead.
AllowManeuvers=true

;Mistakes happen. If you enable them. Racers might be slow to react to 'quick thinking'
;things like oversteer, or misjudge corrections for a fraction of a second. Believe me, that's enough.
;AllowMistakes=true

;Percentage, allows the AI to try and account for downforce when cornering. Keyword 'try'.
AccountForDownforce=100

;Percentage, allows the AI to try and account up and downslopes mid corner,
;making use of the increased or decreased gravity there.
AccountForSlopeChanges=100
