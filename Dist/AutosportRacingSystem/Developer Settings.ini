;AutoSport Racing System — Developer Settings
[GENERAL]
;Sprint+Context (Shift+E) opens the ARS menu. Disable to use the arsmenu cheat instead.
Hotkeys=true

;Load all ARS data at startup. Disable and use arson/arsoff cheats to toggle at runtime.
LoadAtStart=true

;Info,Error,Fatal
LogLevel=Info

[CREATOR_DEFAULTS]
;Trackside gear model used by default when creating a track. 'none' disables the props.
;Spacing in meters.
TracksideModel=prop_wheel_tyre
TracksideModelFrecuency=20

[RACERS]
;How the grid is sorted. Power, PowerDescendent, TopSpeed, TopSpeedDescendent, Random
GridSorting=Random

;Grace period after the first racer crosses the line (seconds).
TimeoutSeconds=30

;0=disabled. 1=fixed when they break enough to affect performance. 2=invincible from the start.
AIRacerAutofix=2

;0=no tuning, 1=visual, 2=visual+performance, 3=visual+performance+random engine boost.
AITuningLevel=0
