[GENERAL_SETTINGS]
;Default number of laps the vehicles will do before considering the race finished.
Laps=5

;Default track filter.
TrackFilter=hardcore

;Default discipline filter.
Disciplines=comet2 dominator2 comet6 gauntlet2 gauntlet3 dominator7 dominator8 brawler kanjosj kanjo
;muscle sport +sponsor

;Discipline aliases. You can input them in the Disciplines filter.
alias=racecar
tags=+sponsor +sports -drift

alias=rallycar
tags=+sponsor +rally

alias=tuner
tags=-sponsor -super +street

alias=musclec
tags=+sponsor +muscle *classic

;Default ammount of vehicles the script will try to spawn for a race by default. Not including yourself.
GridSize=12

;Makes the racers ghosts to each other, doesn't work well.
Ghosts=false

;When summoning racers, sometimes there may be not enough unique racers to fill the grid.
;The script will then start duplicating the racers to fill the grid.
AllowDuplicates=true

[CATCHUP]
;Limits catchup mechanics to the latter half of the grid.
OnlyLastHalf=true

;Limits catchup mechanics to racers behind the player.
;Overrides OnlyLastHalf if the player is participating in the race.
OnlyBehindPlayer=false

;Limits catchup mechanics to cars without any other racer nearby. Helps with credibility.
OnlyLoners=true

;Increases grip for the AI.
;Set to 0 to disable.
CatchupGrip=0

;Increases AI acceleration.
;Set to 0 to disable.
CatchupSpeed=50

;If an AI is leading by over 50m, they will not go past this percentage of the car's top speed.
;Set to 100 to disable.
LeaderTopSpeed=80
