name: Deploy build

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (Release)
        shell: pwsh
        # A fresh checkout has no local build counter, so CI supplies its own: run_number increments per
        # workflow run and is what the release banner reports. The local counter stays out of git.
        run: dotnet build NewRacingSystem.sln -c Release -p:Platform="Any CPU" -p:BuildNumber=${{ github.run_number }} -consoleloggerparameters:ErrorsOnly

      - name: Stage deploy folder
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'deploy'
          $ars = Join-Path $stage 'AutosportRacingSystem'
          New-Item -ItemType Directory -Force -Path $ars | Out-Null
          Copy-Item -Path 'Dist\AutosportRacingSystem\*' -Destination $ars -Recurse -Force
          Copy-Item 'bin\Release\ARS.dll' $ars -Force
          # LemonUI is redistributable (MIT, permission obtained) and is staged BY NAME.
          # Never wildcard bin\Release\* here: that folder also holds ScriptHookVDotNet2.dll,
          # which must always come from the user's own matched SHVDN install (AGENTS-SHVDN.md).
          Copy-Item 'libs\LemonUI.SHVDN2.dll' $ars -Force
          # The banner reads this beside ARS.dll. Stage the number the build actually used rather than
          # re-deriving it here, so the two can never drift.
          Copy-Item 'build\build-number.txt' $ars -Force
          @'
          Autosport Racing System (ARS) - WIP build

          Install: extract the AutosportRacingSystem folder into
          Grand Theft Auto V\Scripts\ (overwrite if updating).

          Included: LemonUI.SHVDN2 1.5.2, used under the MIT License, by JustALemon
          (https://github.com/LemonUIbyLemon/LemonUI).

          Required (install separately, we do not bundle them):
            - ScriptHookV (Alexander Blade): http://www.dev-c.com/gtav/scripthookv/
            - .NET Framework 4.8 and the latest Visual C++ Redistributable.
            - ScriptHookVDotNet Enhanced (SHVDNE), which ships the v2 API dll this mod
              is built against: ScriptHookVDotNet2.dll 2.11.6. Upstream's stable
              v3.6.0 cannot start on current game builds and takes every script down,
              not just ARS.
                https://github.com/Chiheb-Bacha/ScriptHookVDotNetEnhanced
              Copy ScriptHookVDotNet.asi and ScriptHookVDotNet2.dll from the SAME
              install into the game folder (ScriptHookVDotNet.ini too if you want to
              edit it). ARS runs on the v2 API, so an asi paired with an older API dll
              makes it fail silently - nothing else in the game looks wrong.

          If ARS does not appear: open Scripts\AutosportRacingSystem\Log.log -
          it names the reason (for example an SHVDN dll/asi build mismatch).

          Menu: Sprint + Context hotkey, or type arsmenu in the chat console.
          '@ | Set-Content -Encoding UTF8 (Join-Path $stage 'README.txt')
          $zip = "AutosportRacingSystem-$($env:GITHUB_SHA.Substring(0,7)).zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $zip -Force
          "ZIPFILE=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutosportRacingSystem-${{ github.sha }}
          path: AutosportRacingSystem-*.zip

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Build ${{ github.run_number }}
          files: AutosportRacingSystem-*.zip
          prerelease: true
          generate_release_notes: true